name: fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  lex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/lex -run '^$' -fuzz '^FuzzLex$' -fuzztime 10m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lex-crashers
          path: internal/lex/testdata/fuzz
          if-no-files-found: ignore
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/parse -run '^$' -fuzz '^FuzzParse$' -fuzztime 10m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parse-crashers
          path: internal/parse/testdata/fuzz
          if-no-files-found: ignore
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/format -run '^$' -fuzz '^FuzzFormat$' -fuzztime 10m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: format-crashers
          path: internal/format/testdata/fuzz
          if-no-files-found: ignore
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/driver -run '^$' -fuzz '^FuzzCheck$' -fuzztime 10m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-crashers
          path: internal/driver/testdata/fuzz
          if-no-files-found: ignore
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/runtest -run '^$' -fuzz '^FuzzRun$' -fuzztime 10m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: run-crashers
          path: internal/runtest/testdata/fuzz
          if-no-files-found: ignore
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/scene -run '^$' -fuzz '^FuzzScene$' -fuzztime 10m
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: scene-crashers
          path: internal/scene/testdata/fuzz
          if-no-files-found: ignore
