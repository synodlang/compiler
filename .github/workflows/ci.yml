name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    uses: synodlang/.github/.github/workflows/go.yml@main

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: git is present (synod get tests)
        run: git --version
      - run: go vet ./...
      - run: go test ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: git is present (synod get tests)
        run: git --version
      - run: go vet ./...
      - run: go test ./...

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/release/...

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/dsl
          ref: v0.2.10
          path: _dsl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Spec snippets
        run: go test ./internal/spectest -run TestSpecSnippets -v
        env:
          SYNOD_DSL: ${{ github.workspace }}/_dsl
          SYNOD_REQUIRE_DSL: "1"

  examples-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/examples
          path: _examples
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vendored examples match synodlang/examples
        run: go test ./internal/spectest -run TestExamplesDrift -v
        env:
          SYNOD_EXAMPLES: ${{ github.workspace }}/_examples
          SYNOD_REQUIRE_EXAMPLES: "1"

  std-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/std
          path: _std
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Embedded std matches synodlang/std
        run: go test ./internal/stdlib -run TestStdDrift -v
        env:
          SYNOD_STD: ${{ github.workspace }}/_std
          SYNOD_REQUIRE_STD: "1"

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/dsl
          ref: v0.2.10
          path: _dsl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Std catalog, README snippets, doc catalog and explain codes match the spec
        run: go test ./internal/stdlib ./internal/doc ./internal/explain -v
        env:
          SYNOD_DSL: ${{ github.workspace }}/_dsl
          SYNOD_REQUIRE_DSL: "1"

  docs:
    # Inert until the pinned dsl has a tutorial (it has from v0.2.14): the
    # steps below are skipped while _dsl/tutorial/coverage.md is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/dsl
          ref: v0.2.10
          path: _dsl
      - name: Is there a tutorial to check?
        id: tutorial
        run: |
          if [ -f _dsl/tutorial/coverage.md ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            . _dsl/tutorial/versions.env
            echo "examples=$EXAMPLES_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "dsl has no tutorial yet; the docs check is skipped"
          fi
      - uses: actions/checkout@v7
        if: steps.tutorial.outputs.present == 'true'
        with:
          repository: synodlang/examples
          ref: ${{ steps.tutorial.outputs.examples }}
          path: _examples
      - uses: actions/setup-go@v7
        if: steps.tutorial.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Build synod
        if: steps.tutorial.outputs.present == 'true'
        run: go build -o "$RUNNER_TEMP/synod" ./cmd/synod
      - name: Tutorial, coverage and Library examples
        if: steps.tutorial.outputs.present == 'true'
        run: >
          go run ./internal/forms/cmd/doccheck
          -synod "$RUNNER_TEMP/synod"
          -tutorial _dsl/tutorial
          -library _dsl/std/examples
          -examples _examples

  wasm:
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Vet for WebAssembly
        run: go vet ./...
      - name: Build for WebAssembly
        run: go build ./...
      - name: Hash the example traces and scenes under Node
        run: |
          export PATH="$(go env GOROOT)/lib/wasm:$(go env GOROOT)/misc/wasm:$PATH"
          go test ./internal/runtest -run 'TestExampleGoldens|TestTraceHashes' -count=1
        env:
          SYNOD_HASHES_OUT: ${{ github.workspace }}/hashes.txt
      - name: Check goldens under Node
        run: |
          export PATH="$(go env GOROOT)/lib/wasm:$(go env GOROOT)/misc/wasm:$PATH"
          go test ./internal/driver -run TestGolden -count=1
      - uses: actions/upload-artifact@v7
        with:
          name: hashes-wasm
          path: hashes.txt

  trace-hashes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Hash the example traces and scenes
        run: go test ./internal/runtest -run TestTraceHashes -count=1
        env:
          SYNOD_HASHES_OUT: ${{ github.workspace }}/hashes.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hashes-${{ matrix.name }}
          path: hashes.txt

  trace-hashes-compare:
    needs: [trace-hashes, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hashes-*
          path: hashes
      - name: Traces and scenes are byte-identical on Linux, macOS, Windows and WebAssembly
        run: |
          wc -l hashes/hashes-*/hashes.txt
          diff hashes/hashes-linux/hashes.txt hashes/hashes-macos/hashes.txt
          diff hashes/hashes-linux/hashes.txt hashes/hashes-windows/hashes.txt
          diff hashes/hashes-linux/hashes.txt hashes/hashes-wasm/hashes.txt
