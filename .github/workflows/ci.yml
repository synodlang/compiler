name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    uses: synodlang/.github/.github/workflows/go.yml@main

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/release/...

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/dsl
          path: _dsl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Spec snippets
        run: go test ./internal/spectest -run TestSpecSnippets -v
        env:
          SYNOD_DSL: ${{ github.workspace }}/_dsl
          SYNOD_REQUIRE_DSL: "1"

  examples-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/examples
          path: _examples
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vendored examples match synodlang/examples
        run: go test ./internal/spectest -run TestExamplesDrift -v
        env:
          SYNOD_EXAMPLES: ${{ github.workspace }}/_examples
          SYNOD_REQUIRE_EXAMPLES: "1"

  std-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/std
          path: _std
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Embedded std matches synodlang/std
        run: go test ./internal/stdlib -run TestStdDrift -v
        env:
          SYNOD_STD: ${{ github.workspace }}/_std
          SYNOD_REQUIRE_STD: "1"

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: synodlang/dsl
          path: _dsl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Std catalog and README snippets match the std tables
        run: go test ./internal/stdlib -run 'TestCatalog|TestReadmeSnippets' -v
        env:
          SYNOD_DSL: ${{ github.workspace }}/_dsl
          SYNOD_REQUIRE_DSL: "1"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build for WebAssembly
        run: go build ./...
        env:
          GOOS: js
          GOARCH: wasm

  trace-hashes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Hash the example traces and scenes
        run: go test ./internal/runtest -run TestTraceHashes -count=1
        env:
          SYNOD_HASHES_OUT: ${{ github.workspace }}/hashes.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hashes-${{ matrix.name }}
          path: hashes.txt

  trace-hashes-compare:
    needs: trace-hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hashes-*
          path: hashes
      - name: Traces and scenes are byte-identical on Linux, macOS and Windows
        run: |
          wc -l hashes/hashes-*/hashes.txt
          diff hashes/hashes-linux/hashes.txt hashes/hashes-macos/hashes.txt
          diff hashes/hashes-linux/hashes.txt hashes/hashes-windows/hashes.txt
